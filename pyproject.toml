[project]
name = "sinpapel-webhooks"
version = "0.2.0"
description = "Event-driven HTTP communication para sinpapel — outbound + inbound webhooks (HMAC signing, pluggable delivery backends, idempotency)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Julio Adrián", email = "jadrian.s@gmail.com" },
]
keywords = ["django", "webhooks", "events", "hmac", "sinpapel", "workflow", "outbound", "inbound"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sinpapel @ git+ssh://git@github.com/aprendomx/sinpapel.git@v0.5.0",
    "django-simple-history>=3.4",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.12",
    "responses>=0.25",
]
celery = [
    "celery>=5.3",
]
drf = [
    "sinpapel-drf @ git+ssh://git@github.com/aprendomx/sinpapel-drf.git@v0.2.1",
]
admin = [
    "djangorestframework>=3.14",
]

[project.urls]
Homepage = "https://github.com/jadrians/creditos"
Issues = "https://github.com/jadrians/creditos/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Layout flat post split E16 — package files at repo root.
# Subpackages declarados explícitamente (mantiene determinismo + visibilidad).
[tool.setuptools]
packages = [
    "sinpapel_webhooks",
    "sinpapel_webhooks.delivery",
    "sinpapel_webhooks.delivery.backends",
    "sinpapel_webhooks.management",
    "sinpapel_webhooks.management.commands",
    "sinpapel_webhooks.migrations",
    "sinpapel_webhooks.receivers",
    "sinpapel_webhooks.admin_api",
]

[tool.setuptools.package-dir]
sinpapel_webhooks = "."

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
django_find_project = false
addopts = "-m 'not install_smoke'"
markers = [
    "install_smoke: integration smoke tests requiring uv venv + pip install (skip by default; manual run via -m install_smoke)",
]
